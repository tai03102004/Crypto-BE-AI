services:
  crypto-ai-trader:
    build: .
    container_name: crypto-be-ai
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ../.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
